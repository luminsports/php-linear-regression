name: Run PHPUnit Tests

on:
  push:
    branches: [ 'main', 'develop', 'feature/**', 'release/**' ]
    paths: [ 'src/**', 'tests/**', 'phpunit.xml', 'composer.json', 'composer.lock', '.github/workflows/tests.yml' ]
  pull_request:
    branches: [ 'main', 'develop', 'feature/**', 'release/**' ]
    paths: [ 'src/**', 'tests/**', 'phpunit.xml', 'composer.json', 'composer.lock', '.github/workflows/tests.yml' ]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} - ${{ matrix.stability }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.5' ]
        stability: [ prefer-lowest, prefer-stable ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath
          coverage: none
      - name: Install Dependencies
        env:
          STABILITY: ${{ matrix.stability }}
        run: composer update --"$STABILITY" --prefer-dist --no-interaction
      - name: Run PHPUnit Tests
        run: composer test
