name: Run PHP CS Fixer

on:
  push:
    branches: [ 'main', 'develop', 'feature/**', 'release/**' ]
    paths: ['src/**.php']

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  php-cs-fixer:
    name: Run PHP CS Fixer
    runs-on: ubuntu-24.04-arm
    if: "! contains(github.event.head_commit.message, 'style(php-cs-fixer)') && ! (contains(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, format('{0}/{1}', 'luminsports/php-cs-fixer', github.ref_name)))"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run PHP CS Fixer
        uses: luminsports/github-action-php-cs-fixer@main
        with:
          create-pull-request: ${{ github.ref_name == 'main' }}
